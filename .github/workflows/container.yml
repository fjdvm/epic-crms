name: CREOMS container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: creoms:smoke
          build-args: NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect creoms:smoke --format '{{.Size}}')
          echo "CREOMS image: $bytes bytes (limit 450 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 471859200
      - name: Smoke test the running container
        run: bash scripts/container-smoke/run.sh creoms:smoke
