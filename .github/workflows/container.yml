name: CREOMS container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  SYSTEM_BUILD_ARGS: |
    NEXT_PUBLIC_HOST_URL=https://portal.buildwrite.me/
    NEXT_PUBLIC_CRMS_URL=https://creoms.buildwrite.me/
    NEXT_PUBLIC_HRMS_URL=https://hrms.buildwrite.me/
    NEXT_PUBLIC_POS_URL=https://web-pos-alpha-vert.vercel.app/
    NEXT_PUBLIC_IMS_URL=https://br-sims.vercel.app/
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          classification=code
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; then
            base="$BASE_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            # New branches have no before commit; fail safe to full checks.
            if [ "$base" != 0000000000000000000000000000000000000000 ]; then
              # Include both sides of renames and deleted files; preserve unusual filenames.
              git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
              mapfile -d '' -t changed_paths < "$RUNNER_TEMP/changed-paths"
              classification=$(node scripts/ci/classify-changes.mjs "${changed_paths[@]}")
            fi
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "Change classification: $classification" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  container-smoke:
    needs: changes
    if: needs.changes.outputs.classification == 'code' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/next-build-cache
          key: ${{ runner.os }}-creoms-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-creoms-next-${{ hashFiles('package-lock.json') }}-
      - name: Inject Next.js cache mount
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          cache-map: '{"${{ runner.temp }}/next-build-cache": "/app/.next/cache"}'
          scratch-dir: ${{ runner.temp }}/cache-dance
          skip-extraction: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ${{ env.SYSTEM_BUILD_ARGS }}
          load: true
          tags: creoms:smoke
          # PRs only read the dependency cache published by main.
          cache-from: type=gha,scope=creoms-production
      - name: Record and limit uncompressed image size
        run: |
          bytes=$(docker image inspect creoms:smoke --format '{{.Size}}')
          echo "CREOMS image: $bytes bytes (limit 450 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 471859200
      - name: Smoke test the running container
        run: bash scripts/container-smoke/run.sh creoms:smoke

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, checks, container-smoke, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # PR/manual code runs require smoke; main code runs require the image.
      # Docs-only runs require all three conditional jobs to be skipped.
      - name: Require every expected dependency result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLASSIFICATION: ${{ needs.changes.outputs.classification }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          IMAGE_RESULT: ${{ needs.production-image.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$CLASSIFICATION" in
            docs-only)
              test "$CHECKS_RESULT" = skipped
              test "$CONTAINER_RESULT" = skipped
              test "$IMAGE_RESULT" = skipped
              ;;
            code)
              test "$CHECKS_RESULT" = success
              if [ "$EVENT_NAME" = push ]; then
                test "$CONTAINER_RESULT" = skipped
                test "$IMAGE_RESULT" = success
              else
                test "$CONTAINER_RESULT" = success
                test "$IMAGE_RESULT" = skipped
              fi
              ;;
            *) exit 1 ;;
          esac

  production-image:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.classification == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Extract before saving in post steps after a successful main build.
      # PR jobs use restore-only above; Docker cache still publishes after deploy.
      - name: Cache Next.js build data
        id: next-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/next-build-cache
          key: ${{ runner.os }}-creoms-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-creoms-next-${{ hashFiles('package-lock.json') }}-
      - name: Persist Next.js cache mount
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          cache-map: '{"${{ runner.temp }}/next-build-cache": "/app/.next/cache"}'
          scratch-dir: ${{ runner.temp }}/cache-dance
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit == 'true' }}
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ${{ env.SYSTEM_BUILD_ARGS }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=creoms-production

  deploy:
    # Override implicit success(): container-smoke is an intentionally skipped
    # ancestor on main. Every direct dependency must still succeed.
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.classification == 'code' &&
      needs.changes.result == 'success' && needs.checks.result == 'success' &&
      needs.production-image.result == 'success' && needs.ci-gate.result == 'success'
    needs: [changes, checks, production-image, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: creoms-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-brenraphaels
      CONTAINER_APP: ca-creoms
      CREOMS_PUBLIC_URL: https://creoms.buildwrite.me
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify creoms revision
        shell: bash
        env:
          DEPLOY_SECRETS: ${{ toJSON(secrets) }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          CREOMS_IMAGE: ${{ needs.production-image.outputs.image }}
        run: |
          set -euo pipefail
          export AZURE_CORE_ONLY_SHOW_ERRORS=true
          export CONTAINER_ENVIRONMENT_ID
          CONTAINER_ENVIRONMENT_ID=$(az containerapp env show -g "$RESOURCE_GROUP" -n cae-brenraphaels --query id -o tsv)
          # The manifest replaces the whole app config, so carry over any custom domain
          # already bound (creoms.buildwrite.me is bound later by hand) or a deploy would drop it.
          export EXISTING_CUSTOM_DOMAINS='[]'
          if az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query name -o tsv >/dev/null 2>&1; then
            EXISTING_CUSTOM_DOMAINS=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query "properties.configuration.ingress.customDomains || \`[]\`" -o json)
          fi
          export REVISION_SUFFIX="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="$RUNNER_TEMP/creoms-deploy.json"
          trap 'rm -f "$manifest"' EXIT
          python3 scripts/deploy/render-container-app.py "$manifest"
          # Suppress the ARM response: it can contain configuration/secret fields.
          az containerapp create -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --yaml "$manifest" --output none
          bash scripts/deploy/verify-revision.sh
      - uses: docker/setup-buildx-action@v3
      # Export the dependency target, not the runtime image: mode=min on the
      # runtime target would omit npm ci, because dependencies is an intermediate stage.
      - name: Publish dependency cache after deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dependencies
          cache-from: type=gha,scope=creoms-production
          cache-to: type=gha,mode=min,scope=creoms-production
