name: Feedback analysis

# Labels each Feedback's Sentiment 5 times a day. Times are UTC: 08:00, 11:00, 14:00, 17:00 and 20:00 Philippines time.
# Vercel Cron on the Hobby plan runs once a day at most, so GitHub Actions calls the route instead.
on:
  schedule:
    - cron: "0 0,3,6,9,12 * * *"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call the analysis route
        env:
          CREOMS_APP_URL: ${{ secrets.CREOMS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CREOMS_APP_URL/api/cron/feedback-analysis"
