name: Order audit

# Records Order placement and confirmation email outcomes in the Audit Logs every 10 minutes.
# GitHub Actions calls the route on a schedule.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call the order audit route
        env:
          CREOMS_APP_URL: ${{ secrets.CREOMS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CREOMS_APP_URL/api/cron/order-audit"
