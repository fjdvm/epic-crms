name: Proof reader

# Reads payment proofs that were saved and have no result yet. GitHub's shortest schedule is every 5 minutes.
# The Customer's submit never waits for this; the storefront may also call the route with ?proof=<id> right after saving.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Call the proof reader route
        env:
          CREOMS_APP_URL: ${{ secrets.CREOMS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CREOMS_APP_URL/api/cron/proof-reader"
